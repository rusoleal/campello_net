<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>campello_net WASM Client</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { color: #e94560; }
        .controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        input, button {
            padding: 0.5rem 0.75rem;
            font-size: 1rem;
            border: 1px solid #444;
            border-radius: 4px;
            background: #16213e;
            color: #eee;
        }
        input:focus { outline: 2px solid #e94560; }
        button {
            cursor: pointer;
            background: #e94560;
            border: none;
            color: white;
            font-weight: 600;
        }
        button:hover { background: #ff6b81; }
        button:disabled { background: #555; cursor: not-allowed; }
        #status {
            font-weight: bold;
            margin-bottom: 1rem;
            color: #ff0;
        }
        #log {
            background: #0f0f23;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 1rem;
            height: 400px;
            overflow-y: auto;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.9rem;
        }
        #log div { margin-bottom: 0.25rem; }
    </style>
</head>
<body>
    <h1>campello_net WASM Client</h1>

    <div id="status">Initializing...</div>

    <div class="controls">
        <input type="text" id="host" value="localhost" placeholder="Host" style="width: 120px;">
        <input type="number" id="port" value="8765" placeholder="Port" style="width: 80px;">
        <button id="btn-connect" onclick="doConnect()">Connect</button>
        <button id="btn-disconnect" onclick="doDisconnect()" disabled>Disconnect</button>
    </div>

    <div class="controls">
        <input type="text" id="message" value="Hello from WASM!" placeholder="Message" style="flex: 1;">
        <button id="btn-send" onclick="doSend()" disabled>Send</button>
    </div>

    <div id="log"></div>

    <script type="module">
        const statusEl = document.getElementById('status');
        const logEl = document.getElementById('log');
        const btnConnect = document.getElementById('btn-connect');
        const btnDisconnect = document.getElementById('btn-disconnect');
        const btnSend = document.getElementById('btn-send');

        function log(text, color = '#ccc') {
            const entry = document.createElement('div');
            entry.textContent = text;
            entry.style.color = color;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
            console.log(text);
        }

        log('Loading WASM module...', '#888');

        const Module = await import('./wasm_client_example.js');
        const instance = await Module.default();

        log('WASM module loaded.', '#0f0');
        statusEl.textContent = 'Ready — not connected';
        statusEl.style.color = '#ff0';

        window.doConnect = function() {
            const host = document.getElementById('host').value;
            const port = parseInt(document.getElementById('port').value, 10);
            log(`Connecting to ws://${host}:${port} ...`);

            const hostPtr = instance._malloc(host.length + 1);
            instance.stringToUTF8(host, hostPtr, host.length + 1);
            const ok = instance._connect_to_server(hostPtr, port);
            instance._free(hostPtr);

            if (!ok) {
                log('Connection failed (transport rejected).', '#f55');
                return;
            }

            btnConnect.disabled = true;
            btnDisconnect.disabled = false;
            btnSend.disabled = false;
        };

        window.doDisconnect = function() {
            instance._disconnect();
            log('Disconnected.', '#888');
            btnConnect.disabled = false;
            btnDisconnect.disabled = true;
            btnSend.disabled = true;
        };

        window.doSend = function() {
            const text = document.getElementById('message').value;
            if (!text) return;

            const ptr = instance._malloc(text.length + 1);
            instance.stringToUTF8(text, ptr, text.length + 1);
            instance._send_message(ptr);
            instance._free(ptr);

            log('\u2192 ' + text, '#ccc');
            document.getElementById('message').value = '';
        };

        // Allow Enter key to send
        document.getElementById('message').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSend();
        });
    </script>
</body>
</html>
